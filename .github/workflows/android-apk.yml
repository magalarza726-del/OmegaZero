name: OmegaZero Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "assets/v4.2.0-20260915193000/**"
      - "public/**"
      - "index.html"
      - "404.html"
      - "version.json"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android-app/**"
      - "assets/v4.2.0-20260915193000/**"
      - "public/**"
      - "index.html"
      - "404.html"
      - "version.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run web regression tests
        run: npm ci && npm test

      - name: Build offline debug APK
        run: gradle -p android-app :app:assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          test -f android-app/app/build/outputs/apk/debug/app-debug.apk
          cp android-app/app/build/outputs/apk/debug/app-debug.apk OmegaZero-offline-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OmegaZero-offline-debug
          path: OmegaZero-offline-debug.apk
          if-no-files-found: error
          retention-days: 30
